<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI音声インタビュー | 博士キャリア支援ロールモデル</title>
  <style>
    :root {
      --primary-color: #2c4d75;
      --secondary-color: #4a7bb0;
      --bg-color: #f4f7f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #e74c3c;
      --success-color: #27ae60;
    }

    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 680px;
      width: 100%;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      color: var(--primary-color);
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 10px;
    }

    .step-section {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: var(--primary-color);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:hover {
      background-color: var(--secondary-color);
    }

    .btn:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #7f8c8d;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background-color: #95a5a6;
    }

    .btn-success {
      background-color: var(--success-color);
    }

    .btn-success:hover {
      background-color: #2ecc71;
    }

    .chat-box {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      height: 320px;
      overflow-y: auto;
      background-color: #fafafa;
      margin-bottom: 20px;
    }

    .chat-message {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .chat-message.ai {
      align-items: flex-start;
    }

    .chat-message.user {
      align-items: flex-end;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
    }

    .chat-message.ai .chat-bubble {
      background-color: #eef4fb;
      color: #1a365d;
      border-bottom-left-radius: 2px;
    }

    .chat-message.user .chat-bubble {
      background-color: var(--primary-color);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      font-size: 14px;
      color: #666;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-color);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 750px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-close {
      font-size: 24px;
      cursor: pointer;
      color: #888;
    }

    .preview-body {
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🤖 博士キャリア支援 AIインタビュー</h1>

    <!-- ステップ1：事前入力画面 -->
    <div id="step1" class="step-section">
      <div class="form-group">
        <label for="intervieweeName">お名前（必須）</label>
        <input type="text" id="intervieweeName" placeholder="例：山田 太郎">
      </div>
      <div class="form-group">
        <label for="intervieweeAffiliation">ご所属・お立場</label>
        <input type="text" id="intervieweeAffiliation" placeholder="例：◯◯大学 博士キャリア支援センター 特命助教">
      </div>
      <div class="form-group">
        <label for="gasUrl">Web API URL (GAS)</label>
        <input type="text" id="gasUrl" value="https://script.google.com/macros/s/AKfycbz_XXXXXXXXXXXX/exec">
      </div>
      <button class="btn" id="startBtn">音声インタビューを開始する</button>
    </div>

    <!-- ステップ2：インタビュー対話画面 -->
    <div id="step2" class="step-section hidden">
      <div class="status-indicator" id="statusIndicator">
        <div class="pulse-dot"></div>
        <span id="statusText">AIが質問を読み上げています...</span>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="form-group">
        <label for="userInput">回答入力（音声認識またはテキスト入力）</label>
        <textarea id="userInput" rows="3" placeholder="マイクに向かってお話しいただくか、キーボードで直接入力できます..."></textarea>
      </div>

      <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        <button class="btn" id="sendBtn">回答を送信する</button>
        <button class="btn btn-secondary" id="skipBtn" style="width: 35%;">スキップ</button>
      </div>
    </div>

    <!-- ステップ3：完了画面 -->
    <div id="step3" class="step-section hidden">
      <div id="uploadStatusContainer" style="text-align: center; padding: 25px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px;">
        <div id="uploadStatus"></div>
      </div>
      
      <button class="btn btn-success hidden" id="previewBtn">✨ Web掲載イメージを見る</button>
    </div>
  </div>

  <!-- モーダルダイアログ（Webプレビュー表示用） -->
  <div id="previewModal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 style="margin:0; font-size:18px; color:#2c4d75;">📄 自動生成されたWeb掲載イメージ</h2>
        <span class="modal-close" id="modalCloseBtn">&times;</span>
      </div>
      <div class="preview-body" id="previewContent"></div>
    </div>
  </div>

  <script>
    // A・B・C軸 確定版質問セット（全6問）
    const QUESTION_SET = [
      "ご自身のお立場や経歴、そして博士キャリア支援の仕事を始めた当時の状況について教えてください。その時点で『これはすでに得意だった・活かせそうだった』ことや、逆に『全く分からなかった』という経験やスキルがあれば教えてください。",
      "博士支援の仕事で『正解が分からない課題』に直面した具体的な場面を一つ思い出してください。その時、どのように考え、誰に相談したり何を試したりしながら対応していきましたか？",
      "関わり始めた当初と今を比較して、『あの時は分からなかったが、実務を通じたことで分かるようになった』という具体的な気づきがあれば教えてください。（学生の考え方、大学の制度、企業のニーズなど）",
      "実務の中で『こうしてみたら支援がうまくいくようになった』『学生や企業からの反応が良い方に変わった』という具体的な工夫や改善策があれば、その背景にある考え方と一緒に教えてください。",
      "ご自身が実務の中で身につけたノウハウの中で、『これは意識的に他の支援者にも伝えたい』『新しく入る人に教えたい・標準化したい』と思うスキルやアプローチは何ですか？",
      "これから博士キャリア支援者を目指す方へメッセージをお願いします。『最初は正解が分からなくて当然だが、こういう考え方や向き合い方があると成長していける』といったアドバイスがあれば教えてください。"
    ];

    let currentQuestionIndex = 0;
    let isFollowupPhase = false;
    let transcript = [];
    let sessionId = "session_" + new Date().getTime();
    let currentQuestionText = "";
    let generatedDraftHtml = "";
    let isSavingCompleted = false;

    // 音声合成 (SpeechSynthesis)
    const synth = window.speechSynthesis;
    let isSpeaking = false;

    // 音声認識 (SpeechRecognition)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecognizing = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          }
        }
        if (finalTranscript) {
          const userInput = document.getElementById('userInput');
          userInput.value += (userInput.value ? ' ' : '') + finalTranscript;
        }
      };

      recognition.onerror = (event) => {
        console.warn("Speech recognition error:", event.error);
      };

      recognition.onend = () => {
        if (isRecognizing) {
          try { recognition.start(); } catch(e) {}
        }
      };
    }

    // DOM要素
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const step3 = document.getElementById('step3');
    const startBtn = document.getElementById('startBtn');
    const sendBtn = document.getElementById('sendBtn');
    const skipBtn = document.getElementById('skipBtn');
    const previewBtn = document.getElementById('previewBtn');
    const intervieweeName = document.getElementById('intervieweeName');
    const chatBox = document.getElementById('chatBox');
    const statusText = document.getElementById('statusText');
    const previewModal = document.getElementById('previewModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const previewContent = document.getElementById('previewContent');

    // 画面離脱防止の警告制御
    window.addEventListener('beforeunload', (e) => {
      if (transcript.length > 0 && !isSavingCompleted) {
        e.preventDefault();
        e.returnValue = 'インタビューの保存処理中です。この画面を閉じるとデータが失われる可能性があります。';
      }
    });

    // イベン listener
    startBtn.addEventListener('click', startInterview);
    sendBtn.addEventListener('click', handleUserSubmit);
    skipBtn.addEventListener('click', handleSkip);
    previewBtn.addEventListener('click', () => previewModal.classList.remove('hidden'));
    modalCloseBtn.addEventListener('click', () => previewModal.classList.add('hidden'));

    function startInterview() {
      if (!intervieweeName.value.trim()) {
        alert('お名前を入力してください。');
        return;
      }

      step1.classList.add('hidden');
      step2.classList.remove('hidden');

      startAudioRecognition();
      askNextMainQuestion();
    }

    function startAudioRecognition() {
      if (recognition && !isRecognizing) {
        try {
          recognition.start();
          isRecognizing = true;
        } catch (e) {
          console.error("Recognition start error:", e);
        }
      }
    }

    function stopAudioRecognition() {
      if (recognition && isRecognizing) {
        isRecognizing = false;
        try { recognition.stop(); } catch (e) {}
      }
    }

    function speakText(text, callback) {
      if (!synth) {
        if (callback) callback();
        return;
      }

      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 1.0;

      statusText.innerText = 'AIが質問を読み上げています...';
      isSpeaking = true;

      utterance.onend = () => {
        isSpeaking = false;
        statusText.innerText = 'ご回答をお話し（または入力）ください';
        if (callback) callback();
      };

      utterance.onerror = () => {
        isSpeaking = false;
        statusText.innerText = 'ご回答をお話し（または入力）ください';
        if (callback) callback();
      };

      synth.speak(utterance);
    }

    function appendMessage(speaker, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-message ${speaker === 'AI' ? 'ai' : 'user'}`;
      
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble';
      bubble.innerText = text;

      msgDiv.appendChild(bubble);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      transcript.push({ speaker: speaker, text: text, time: new Date().toISOString() });
    }

    function askNextMainQuestion() {
      if (currentQuestionIndex >= QUESTION_SET.length) {
        finishInterview();
        return;
      }

      isFollowupPhase = false;
      currentQuestionText = `【質問 ${currentQuestionIndex + 1}】 ${QUESTION_SET[currentQuestionIndex]}`;
      appendMessage('AI', currentQuestionText);
      speakText(currentQuestionText);
    }

    async function handleUserSubmit() {
      const userInput = document.getElementById('userInput');
      const answerText = userInput.value.trim();

      if (!answerText) {
        alert('回答を入力または音声でお話しください。');
        return;
      }

      appendMessage('回答者', answerText);
      userInput.value = '';

      if (!isFollowupPhase) {
        // メイン質問に対する回答 ➔ AI深掘り質問を取得
        isFollowupPhase = true;
        statusText.innerText = 'AIが深掘り質問を考えています...';
        sendBtn.disabled = true;

        const followupQuestion = await fetchAIFollowup(answerText);
        sendBtn.disabled = false;

        currentQuestionText = followupQuestion;
        appendMessage('AI', followupQuestion);
        speakText(followupQuestion);
      } else {
        // 深掘り質問に対する回答 ➔ 次のメイン質問へ
        currentQuestionIndex++;
        askNextMainQuestion();
      }
    }

    function handleSkip() {
      appendMessage('回答者', '（スキップされました）');
      document.getElementById('userInput').value = '';

      if (!isFollowupPhase) {
        currentQuestionIndex++;
        askNextMainQuestion();
      } else {
        currentQuestionIndex++;
        askNextMainQuestion();
      }
    }

    // 深掘り質問取得関数（タイムアウト60秒＋自動再試行付き）
    async function fetchAIFollowup(userAnswer, retries = 1) {
      const url = document.getElementById('gasUrl').value.trim();
      
      for (let attempt = 0; attempt <= retries; attempt++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 60000); // 60秒制限

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ 
              mode: 'followup', 
              currentQuestion: currentQuestionText, 
              userAnswer: userAnswer 
            }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const data = await res.json();
          if (data.status === 'ok' && data.question) {
            return data.question;
          }
        } catch (e) {
          console.warn(`Followup attempt ${attempt + 1} failed:`, e);
          if (attempt === retries) break;
          await new Promise(r => setTimeout(r, 1000));
        }
      }
      
      return "ご回答ありがとうございます！その点について、具体的に印象に残っているエピソードなどはありますか？";
    }

    function finishInterview() {
      stopAudioRecognition();
      if (synth) synth.cancel();

      step2.classList.add('hidden');
      step3.classList.remove('hidden');

      uploadFinalData();
    }

    // データ保存アップロード（6分タイムアウト制御・安心メッセージ付き）
    async function uploadFinalData() {
      const uploadStatusContainer = document.getElementById('uploadStatusContainer');
      const uploadStatus = document.getElementById('uploadStatus');

      uploadStatusContainer.style.background = '#fcf8e3';
      uploadStatusContainer.style.borderColor = '#faebcc';
      uploadStatus.innerHTML = '<span style="color:#2c4d75; font-size:16px;">⏳ インタビューデータを保存・Web原稿を生成中です...</span><br>' +
        '<span style="font-size:13px; color:#555; margin-top:6px; display:inline-block;">⚠️ ご回答量により、完了まで<b>1〜3分程度</b>かかる場合があります。完了まで画面（タブ）を閉じずにお待ちください。</span>';

      const name = intervieweeName.value.trim() || '回答者';
      const affiliation = document.getElementById('intervieweeAffiliation').value.trim();
      const url = document.getElementById('gasUrl').value.trim();

      const payload = {
        name: name,
        affiliation: affiliation,
        sessionId: sessionId,
        transcript: transcript.map(t => `【${t.speaker}】${t.text}`).join('\n\n')
      };

      const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 360000); // 6分制限

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const json = await res.json();

        if (json && json.draftHtml) {
          generatedDraftHtml = json.draftHtml;
          previewContent.innerHTML = generatedDraftHtml;
          previewBtn.classList.remove('hidden');
        }
      } catch (e) {
        console.error('Data upload error / timeout:', e);
      } finally {
        clearTimeout(timeoutId);
        isSavingCompleted = true;
        uploadStatusContainer.style.background = '#eef8f2';
        uploadStatusContainer.style.borderColor = '#a3e2bb';
        
        uploadStatus.innerHTML = '✅ インタビュー内容の保存が完了しました！<br><br>' +
          '<strong style="color:#2c4d75; font-size:16px;">✨ ご回答いただき誠にありがとうございました。この画面（タブ）を閉じて終了してください。</strong>';
      }
    }
  </script>
</body>
</html>
