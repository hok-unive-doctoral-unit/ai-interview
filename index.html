<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博士キャリア支援 AIインタビュー</title>
<style>
  :root {
    --primary: #2c4d75;
    --primary-hover: #1e3654;
    --accent-red: #e74c3c;
    --accent-green: #27ae60;
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
  }

  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    padding: 20px 10px;
    color: #333;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 720px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .header {
    background: var(--primary);
    color: #fff;
    padding: 20px;
    text-align: center;
  }
  .header h1 { margin: 0; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .header p { margin: 6px 0 0 0; font-size: 13px; opacity: 0.8; }

  .content { padding: 24px; }

  /* アバター画像表示エリア */
  .avatar-container {
    text-align: center;
    margin-bottom: 20px;
  }
  .avatar-img {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }
  .avatar-status {
    margin-top: 10px;
    font-size: 14px;
    color: var(--primary);
    font-weight: 600;
  }

  /* 質問カード */
  .question-box {
    background: #eef5fc;
    border-left: 5px solid var(--primary);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .question-title { font-size: 12px; color: var(--primary); font-weight: bold; margin-bottom: 4px; }
  .question-text { font-size: 16px; font-weight: bold; color: #1a252f; line-height: 1.5; }

  /* テキスト・回答入力 */
  textarea {
    width: 100%;
    height: 100px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
    box-sizing: border-box;
    resize: vertical;
  }

  /* ボタンエリア */
  .button-group {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-mic { background: var(--accent-red); color: #fff; }
  .btn-skip { background: #e74c3c; color: #fff; }
  .btn-secondary { background: #7f8c8d; color: #fff; }
  button:disabled { background: #bdc3c7; cursor: not-allowed; }

  /* 進捗バー */
  .progress-container { margin-top: 20px; text-align: center; }
  .progress-bar { height: 6px; background: #e0e0e0; border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
  .progress-text { font-size: 12px; color: #7f8c8d; }

  .hidden { display: none !important; }
  
  /* 設定フォーム用 */
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
  .form-group input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎤 博士キャリア支援 AIインタビュー</h1>
    <p>リアルタイム音声対話 + AI分析</p>
  </div>

  <div class="content">

    <!-- 1. 初期設定画面 -->
    <div id="setupSection">
      <div class="form-group">
        <label>お名前:</label>
        <input type="text" id="intervieweeName" placeholder="例: 山田 太郎">
      </div>
      <div class="form-group">
        <label>ご所属 (大学・機関名等):</label>
        <input type="text" id="intervieweeAffiliation" placeholder="例: ○○大学 大学院">
      </div>
      <div class="form-group" style="margin-top: 16px;">
        <label style="font-weight: normal; font-size: 13px;">
          <input type="checkbox" id="enableSpeech" checked> AIの質問を音声で読み上げる
        </label>
        <label style="font-weight: normal; font-size: 13px; margin-top: 6px;">
          <input type="checkbox" id="consent"> 録音・文字起こし・データ保存に同意します
        </label>
      </div>

      <!-- GAS URL -->
      <input type="hidden" id="gasUrl" value="https://script.google.com/macros/s/AKfycbyZLmzYt2qUVojXi6DGvqcaQflzjDuiB9KUXbdD4AckVZzj1XCRQwtnIgKDSwuTgPj8bQ/exec">

      <div style="text-align: center; margin-top: 24px;">
        <button id="startBtn" class="btn-primary" disabled style="width: 100%; justify-content: center; padding: 14px;">インタビューを開始する</button>
      </div>
    </div>

    <!-- 2. インタビュー対話画面 -->
    <div id="interviewSection" class="hidden">
      <!-- 中央AIアバター画像 -->
      <div class="avatar-container">
        <img src="avatar.png" alt="AI Interviewer" class="avatar-img" id="avatarImg">
        <div class="avatar-status" id="avatarStatus">回答をお待ちしています</div>
      </div>

      <!-- 質問テキストボックス -->
      <div class="question-box">
        <div class="question-title">質問</div>
        <div class="question-text" id="questionText">読み込み中...</div>
      </div>

      <!-- 回答入力エリア -->
      <textarea id="answerInput" placeholder="ここに回答が表示されます（マイクで話すか、直接入力してください）..."></textarea>

      <!-- 操作ボタン群 -->
      <div class="button-group">
        <button id="micToggleBtn" class="btn-mic">🎙️ 聞き始める</button>
        <button id="submitBtn" class="btn-primary">✉️ 送信</button>
        <button id="skipBtn" class="btn-skip">⏩ スキップ</button>
      </div>

      <!-- 進捗バー -->
      <div class="progress-container">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">質問 1 / 6</div>
      </div>
    </div>

    <!-- 3. インタビュー終了画面 -->
    <div id="finishSection" class="hidden" style="text-align: center;">
      <h2 style="color: var(--primary);">🎉 インタビューが終了しました</h2>
      <p style="font-size: 14px; color: #555;">ご協力ありがとうございました。<br>データはGoogleドライブおよびスプレッドシートへ自動送信されています。</p>
      
      <p id="uploadStatus" style="font-size: 13px; color: var(--primary); font-weight: bold; margin: 20px 0;"></p>

      <div class="button-group" style="flex-direction: column; gap: 10px;">
        <button id="previewBtn" class="btn-primary hidden" style="justify-content: center;">🌐 Web掲載イメージを見る</button>
        <button id="downloadTranscriptBtn" class="btn-secondary" style="justify-content: center;">📝 文字起こし全文をダウンロード</button>
      </div>
    </div>

  </div>
</div>

<script>
// 最新の質問項目セット（6問）
const QUESTION_SET = [
  '現在のご所属と、どのような研究・お仕事をされているか教えてください。',
  'これまでの主なキャリアのご経歴について教えてください。',
  '博士支援に関わるようになったきっかけやご動機は何ですか？',
  '現在のお仕事で特にやりがいを感じる瞬間はどんなときですか？',
  'これまでで苦労されたことや、それをどう乗り越えたかを教えてください。',
  'これからキャリア支援を目指す方や後輩の博士人材へメッセージをお願いします。'
];

let qIndex = 0;
let followupCount = 0;
const MAX_FOLLOWUP = 1; // 1質問あたり最大1回の深掘り
let transcript = [];
let sessionId = '';
let currentQuestionText = '';
let awaitingSubmit = false;
let generatedDraftHtml = '';

// DOM要素
const setupSection = document.getElementById('setupSection');
const interviewSection = document.getElementById('interviewSection');
const finishSection = document.getElementById('finishSection');
const consent = document.getElementById('consent');
const intervieweeName = document.getElementById('intervieweeName');
const startBtn = document.getElementById('startBtn');
const questionText = document.getElementById('questionText');
const answerInput = document.getElementById('answerInput');
const avatarStatus = document.getElementById('avatarStatus');
const micToggleBtn = document.getElementById('micToggleBtn');
const submitBtn = document.getElementById('submitBtn');
const skipBtn = document.getElementById('skipBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

// 同意チェック
consent.addEventListener('change', updateStartStatus);
intervieweeName.addEventListener('input', updateStartStatus);
function updateStartStatus() {
  startBtn.disabled = !(consent.checked && intervieweeName.value.trim().length > 0);
}

// 音声読み上げ
function speak(text) {
  return new Promise(resolve => {
    if (!document.getElementById('enableSpeech').checked) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 1.0;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

// 音声認識（Web Speech API）
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognizing = false;

function initRecognition() {
  if (!SR) return;
  recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    recognizing = true;
    micToggleBtn.textContent = '⏹ 停止する';
    avatarStatus.textContent = 'お話しください（音声認識中...）';
  };

  recognition.onresult = (e) => {
    let interim = '';
    let final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        final += e.results[i][0].transcript;
      } else {
        interim += e.results[i][0].transcript;
      }
    }
    if (final) answerInput.value += final;
  };

  recognition.onend = () => {
    recognizing = false;
    micToggleBtn.textContent = '🎙️ 聞き始める';
    avatarStatus.textContent = '回答をお待ちしています';
  };
}

micToggleBtn.addEventListener('click', () => {
  if (!SR) { alert('お使いのブラウザは音声認識に対応していません。'); return; }
  if (!recognition) initRecognition();
  if (recognizing) {
    recognition.stop();
  } else {
    recognition.start();
  }
});

// 開始処理
startBtn.addEventListener('click', () => {
  setupSection.classList.add('hidden');
  interviewSection.classList.remove('hidden');
  sessionId = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 15);
  qIndex = 0;
  askCurrent();
});

// 質問開始
async function askCurrent() {
  currentQuestionText = QUESTION_SET[qIndex];
  questionText.textContent = currentQuestionText;
  
  const total = QUESTION_SET.length;
  progressText.textContent = `質問 ${qIndex + 1} / ${total}`;
  progressFill.style.width = `${((qIndex + 1) / total) * 100}%`;

  transcript.push({ speaker: 'AI', text: currentQuestionText });
  answerInput.value = '';
  avatarStatus.textContent = 'AIがお話し中...';
  
  await speak(currentQuestionText);
  avatarStatus.textContent = '回答をお待ちしています';
}

// 送信ボタン押下
submitBtn.addEventListener('click', () => { processAnswer(answerInput.value.trim()); });
skipBtn.addEventListener('click', () => { processAnswer('（スキップされました）'); });

// AI 深掘り質問呼び出し
async function fetchAIFollowup(userAnswer) {
  const url = document.getElementById('gasUrl').value.trim();
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ mode: 'followup', currentQuestion: currentQuestionText, userAnswer: userAnswer })
    });
    const data = await res.json();
    if (data.status === 'ok' && data.question) return data.question;
  } catch (e) {
    console.error('Followup fetch error:', e);
  }
  return "素敵なお話をありがとうございます！その点について、もう少し詳しく教えていただけますか？";
}

async function processAnswer(answer) {
  if (awaitingSubmit) return;
  if (!answer) { alert('回答を入力するかマイクでお話しください。'); return; }

  awaitingSubmit = true;
  if (recognizing) recognition.stop();
  speechSynthesis.cancel();

  transcript.push({ speaker: '回答者', text: answer });

  // 深掘り判定
  let isFollowup = false;
  if (followupCount < MAX_FOLLOWUP && answer.length >= 5 && answer !== '（スキップされました）') {
    followupCount++;
    avatarStatus.textContent = 'AIが回答を分析して次の深掘り質問を考えています...';
    submitBtn.disabled = true;

    const followupQ = await fetchAIFollowup(answer);
    currentQuestionText = followupQ;
    questionText.textContent = followupQ;
    transcript.push({ speaker: 'AI', text: followupQ });
    
    submitBtn.disabled = false;
    awaitingSubmit = false;
    avatarStatus.textContent = 'AIがお話し中...';
    await speak(followupQ);
    avatarStatus.textContent = '回答をお待ちしています';
    answerInput.value = '';
    return;
  }

  // 次の主質問へ
  followupCount = 0;
  qIndex++;
  awaitingSubmit = false;

  if (qIndex < QUESTION_SET.length) {
    askCurrent();
  } else {
    // 終了処理
    interviewSection.classList.add('hidden');
    finishSection.classList.remove('hidden');
    speak('お疲れ様でした。すべての質問が終了しました。ご協力ありがとうございました。');
    uploadFinalData();
  }
}

// 最終データ送信（ドライブ＆スプレッドシート保存）
async function uploadFinalData() {
  const uploadStatus = document.getElementById('uploadStatus');
  uploadStatus.textContent = 'スプレッドシートおよびGoogleドライブへ保存中...';

  const name = intervieweeName.value.trim() || '回答者';
  const affiliation = document.getElementById('intervieweeAffiliation').value.trim();
  const url = document.getElementById('gasUrl').value.trim();

  const payload = {
    name: name,
    affiliation: affiliation,
    sessionId: sessionId,
    transcript: transcript.map(t => `【${t.speaker}】${t.text}`).join('\n\n')
  };

  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if (json.status === 'ok') {
      uploadStatus.textContent = '✅ スプレッドシートおよびGoogleドライブへの保存が完了しました！';
      if (json.draftHtml) {
        generatedDraftHtml = json.draftHtml;
        document.getElementById('previewBtn').classList.remove('hidden');
      }
    } else {
      uploadStatus.textContent = '⚠️ 一部保存に失敗しました。';
    }
  } catch (e) {
    uploadStatus.textContent = '❌ 送信中にエラーが発生しました。';
  }
}

// ダウンロード・プレビュー機能
document.getElementById('downloadTranscriptBtn').addEventListener('click', () => {
  const text = transcript.map(t => `【${t.speaker}】${t.text}`).join('\n\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'インタビュー文字起こし.txt';
  a.click();
});

document.getElementById('previewBtn').addEventListener('click', () => {
  if (!generatedDraftHtml) return;
  const blob = new Blob([generatedDraftHtml], { type: 'text/html;charset=utf-8' });
  window.open(URL.createObjectURL(blob), '_blank');
});
</script>

</body>
</html>
